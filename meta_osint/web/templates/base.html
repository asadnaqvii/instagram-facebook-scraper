<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Strat-Watch Meta{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='design.css') }}">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (function () {
      var t = localStorage.getItem('meta_osint_theme') || 'dark';
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
</head>
<body>
  {% import "_logos.html" as logos %}
  {% set path = request.path %}
  <header class="topbar">
    <span class="brand"><span class="mark" style="display:inline-flex; align-items:center;">{{ logos.meta(20) }}</span> Strat-Watch Meta <span class="micro" style="color:var(--fg-3);">OSINT · IG / FB</span></span>

    <div id="login-status" style="display:flex; gap:10px; margin-left:var(--sp-5);">
      <a class="login-pill" href="{{ url_for('login_action', platform='instagram') }}" data-platform="instagram" title="checking Instagram… (click to log in / switch account)">
        {{ logos.instagram(15) }} <span class="login-dot" style="background:var(--fg-3);"></span> IG
      </a>
      <a class="login-pill" href="{{ url_for('login_action', platform='facebook') }}" data-platform="facebook" title="checking Facebook… (click to log in / switch account)">
        {{ logos.facebook(15) }} <span class="login-dot" style="background:var(--fg-3);"></span> FB
      </a>
    </div>

    <a id="scrape-badge" href="#" style="margin-left:auto; display:none; align-items:center; gap:6px;
        background:var(--accent-intel-tint); border:1px solid var(--accent-intel); color:var(--accent-intel);
        border-radius:var(--r-pill); padding:3px 12px; font-size:12px; font-family:var(--font-mono); text-decoration:none;">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--accent-intel);display:inline-block;
            animation:pulse 1.2s ease-in-out infinite;"></span>
      <span id="scrape-badge-text">scraping…</span>
    </a>
    <button id="theme-toggle" class="btn-ghost" title="Toggle light / dark"
            style="margin-left:auto; padding:5px 10px; font-family:var(--font-mono); font-size:12px;">◐ theme</button>
    <label style="color:var(--fg-2); font-size:12px; font-family:var(--font-mono);
                  display:flex; align-items:center; gap:6px; cursor:pointer; margin-left:16px;">
      <input type="checkbox" id="autorefresh-toggle"> auto-refresh
      <span id="autorefresh-countdown" class="muted" style="min-width:28px;"></span>
    </label>
  </header>

  <div class="app">
    <nav class="rail">
      <a href="{{ url_for('index') }}" class="{{ 'active' if path == '/' }}"><span class="rail-label">▚</span> Dashboard</a>
      <a href="{{ url_for('posts') }}" class="{{ 'active' if path.startswith('/posts') }}"><span class="rail-label">▤</span> Posts</a>
      <a href="{{ url_for('accounts') }}" class="{{ 'active' if path.startswith('/accounts') }}"><span class="rail-label">◉</span> Accounts</a>
      <a href="{{ url_for('hashtags') }}" class="{{ 'active' if path.startswith('/hashtags') }}"><span class="rail-label">#</span> Hashtags</a>
      <div style="height:1px; background:var(--border-default); margin:10px 8px;"></div>
      <a href="{{ url_for('scrape') }}" class="{{ 'active' if path.startswith('/scrape') or path.startswith('/job') }}"><span class="rail-label" style="color:var(--brand-signal);">＋</span> New scrape</a>
    </nav>

    <main class="main">
      <div class="container">
        {% block body %}{% endblock %}
      </div>
    </main>
  </div>

  <script>
  // Theme toggle (light / dark), persisted.
  (function () {
    const btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('meta_osint_theme', 'dark'); }
      else { document.documentElement.setAttribute('data-theme', 'light'); localStorage.setItem('meta_osint_theme', 'light'); }
    });
  })();

  // Login status — poll each platform's live connection + login state.
  (function () {
    const pills = {};
    document.querySelectorAll('.login-pill').forEach(p => pills[p.dataset.platform] = p);
    function apply(platform, info) {
      const pill = pills[platform]; if (!pill) return;
      pill.classList.remove('ok', 'warn', 'down');
      const short = platform === 'instagram' ? 'IG' : 'FB';
      let cls = '', title = '', suffix = '';
      if (!info) { title = platform + ': status unknown'; }
      else if (info.state === 'logged_in') {
        cls = 'ok'; suffix = ' · in';
        title = platform + ': logged in' + (info.username ? ' as @' + info.username : '') + ' — click to switch account / log out';
      }
      else if (info.state === 'not_logged_in') {
        cls = 'warn'; suffix = ' · out';
        title = platform + ': Chrome open but NOT logged in — click to open the login page';
      }
      else {
        cls = 'down'; suffix = ' · off';
        title = platform + ': Chrome not running — launch scripts/start_chrome_' + platform + '.bat';
      }
      if (cls) pill.classList.add(cls);
      pill.title = title;
      // keep the leading dot span, replace the trailing text node
      pill.lastChild.textContent = ' ' + short + suffix;
    }
    async function check() {
      try {
        const r = await fetch('/api/login-status');
        if (r.ok) {
          const d = await r.json();
          const p = d.platforms || {};
          apply('instagram', p.instagram);
          apply('facebook', p.facebook);
        }
      } catch (e) { /* ignore */ }
      setTimeout(check, 30000);   // re-check every 30s
    }
    check();
  })();

  // Header "scraping…" badge — polls for active jobs every 3s so you always
  // know a scrape is running, even after navigating away from its job page.
  (function () {
    const badge = document.getElementById('scrape-badge');
    const badgeText = document.getElementById('scrape-badge-text');
    async function checkJobs() {
      try {
        const r = await fetch('/api/jobs/active');
        if (r.ok) {
          const d = await r.json();
          if (d.count > 0) {
            const job = d.active[0];
            const kw = (job.keywords || []).slice(0, 2).join(', ');
            badgeText.textContent = d.count > 1
              ? `scraping ${d.count} jobs…`
              : `scraping${kw ? ' ' + kw : ''}…`;
            badge.href = '/job/' + job.id;
            badge.style.display = 'flex';
          } else {
            badge.style.display = 'none';
          }
        }
      } catch (e) { /* ignore */ }
      setTimeout(checkJobs, 3000);
    }
    checkJobs();
  })();

  // Dashboard auto-refresh. Off by default; the choice is remembered. Pauses
  // when the tab is hidden or an interactive element (form/video/details) is
  // in use, so a refresh never interrupts you mid-action.
  (function () {
    const INTERVAL = 15;
    const toggle = document.getElementById('autorefresh-toggle');
    const countdownEl = document.getElementById('autorefresh-countdown');
    let remaining = INTERVAL;
    const enabled = () => localStorage.getItem('meta_osint_autorefresh') === '1';
    toggle.checked = enabled();

    function userIsBusy() {
      const a = document.activeElement;
      if (a && ['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(a.tagName)) return true;
      for (const v of document.querySelectorAll('video')) {
        if (!v.paused && !v.ended && v.currentTime > 0) return true;
      }
      for (const d of document.querySelectorAll('details[open]')) return true;
      return false;
    }

    toggle.addEventListener('change', () => {
      localStorage.setItem('meta_osint_autorefresh', toggle.checked ? '1' : '0');
      remaining = INTERVAL;
      countdownEl.textContent = toggle.checked ? remaining + 's' : '';
    });

    setInterval(() => {
      if (!toggle.checked) { countdownEl.textContent = ''; return; }
      if (document.hidden || userIsBusy()) { countdownEl.textContent = '⏸'; return; }
      remaining -= 1;
      countdownEl.textContent = remaining + 's';
      if (remaining <= 0) window.location.reload();
    }, 1000);

    if (toggle.checked) countdownEl.textContent = remaining + 's';
  })();
  </script>
</body>
</html>
